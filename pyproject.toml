[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-first"
version = "0.1.0"
description = "CPA 1차 회계학/세법개론 합격 운영체계 — 처방 엔진 트랙"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
solver = [
    "anthropic>=0.39",
]
observability = [
    "sentry-sdk[fastapi]>=2.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.scripts]
cpa-validate = "cpa_first.cli.validate:main"
cpa-export-rules = "cpa_first.cli.export_rules:main"
cpa-serve = "cpa_first.api.main:cli"
cpa-benchmark = "cpa_first.benchmark.runner:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cpa_first*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# 신규 프로덕션 모듈만 lint 게이트 대상. 레거시 14k LOC / 스크립트는 점진 적용.
extend-exclude = ["scripts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends()를 기본값에 두는 관용 패턴 허용

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# 신규 모듈만 엄격 타입체크. 레거시는 점진 적용.
files = ["cpa_first/config.py", "cpa_first/logging_config.py", "cpa_first/db", "cpa_first/auth"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["cpa_first"]
omit = [
    "cpa_first/benchmark/*",
    "cpa_first/eval_gen/*",
    "cpa_first/cli/*",
]
